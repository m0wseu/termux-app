name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        shell: bash {0}
        run: |
          # Plain releases only: vX.Y.Z, never prereleases or build metadata.
          PREVIOUS="$(git tag -l 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)"
          if [ -z "$PREVIOUS" ]; then
              PREVIOUS="v0.0.0"
          fi

          MINOR="$(printf '%s' "$PREVIOUS" | cut -d. -f2)"
          PATCH="$(printf '%s' "$PREVIOUS" | cut -d. -f3)"

          # The patch number runs 0-9 and then carries over into the minor:
          # v0.118.3 -> .4 -> .5 ... -> .9 -> v0.119.0 -> .1 ...
          NEXT_TOTAL=$(( MINOR * 10 + PATCH + 1 ))
          NEXT_MINOR=$(( NEXT_TOTAL / 10 ))
          NEXT_PATCH=$(( NEXT_TOTAL % 10 ))
          NEXT="v0.${NEXT_MINOR}.${NEXT_PATCH}"

          if git rev-parse -q --verify "refs/tags/$NEXT" > /dev/null; then
              echo "Tag '$NEXT' already exists" >&2
              exit 1
          fi

          echo "Previous release: $PREVIOUS"
          echo "Next release:     $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package_variant }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE_VARIANT: ${{ matrix.package_variant }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Import signing key
        shell: bash {0}
        env:
          KEYSTORE_BASE64: ${{ secrets.TERMUX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "TERMUX_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/termux-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "TERMUX_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Keystore written to $KEYSTORE_PATH"

      - name: Build APKs
        shell: bash {0}
        env:
          TERMUX_KEYSTORE_PASSWORD: ${{ secrets.TERMUX_KEYSTORE_PASSWORD }}
          TERMUX_KEY_ALIAS: ${{ secrets.TERMUX_KEY_ALIAS }}
          TERMUX_KEY_PASSWORD: ${{ secrets.TERMUX_KEY_PASSWORD }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_VERSION_TAG="$VERSION+$PACKAGE_VARIANT-github-release"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          if ! printf "%s" "${APK_VERSION_TAG/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            exit_on_error "The versionName '${APK_VERSION_TAG/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          echo "Building APKs for '$APK_VERSION_TAG'"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"
          export TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS="1"
          if ! ./gradlew assembleRelease; then
            exit_on_error "Build failed for '$APK_VERSION_TAG'."
          fi

          echo "Validating APKs"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found:"$'\n'"$(ls "$APK_DIR_PATH")"
            fi
          done

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha256sums failed for '$APK_VERSION_TAG'."
          fi

      - name: Verify APK signatures
        shell: bash {0}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_BASENAME_PREFIX="termux-app_$VERSION+$PACKAGE_VARIANT-github-release"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          echo "Using $APKSIGNER"

          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            apk="$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"
            if ! "$APKSIGNER" verify --print-certs "$apk" > /dev/null 2>&1; then
              exit_on_error "APK is not signed: $apk"
            fi
          done

          echo "All APKs are signed. Certificate:"
          "$APKSIGNER" verify --print-certs "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk" | head -n 4

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: apks-${{ matrix.package_variant }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: sums-${{ matrix.package_variant }}
          path: app/build/outputs/apk/release/*_sha256sums
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [ version, build ]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download APKs
        uses: actions/download-artifact@v6
        with:
          pattern: apks-*
          merge-multiple: true
          path: dist

      - name: Download checksums
        uses: actions/download-artifact@v6
        with:
          pattern: sums-*
          merge-multiple: true
          path: dist

      - name: Create release
        shell: bash {0}
        run: |
          gh release create "$VERSION" --target master --title "$VERSION" --notes ""

      - name: Upload APKs to release
        shell: bash {0}
        run: |
          ls -l dist
          gh release upload "$VERSION" dist/* --clobber
